name: Assemble publication HTML
on:
  push:
    branches: [main]
    paths: ['bootstrap/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: assemble-lecaa-cast
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the original HTML
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          folder = Path('bootstrap')
          if not (folder / 'parts.json').exists():
              print('Publication HTML already assembled.')
              raise SystemExit(0)
          spec = json.loads((folder / 'parts.json').read_text())
          data = b''.join((folder / p).read_bytes() for p in spec['parts'])
          assert len(data) == spec['bytes'], 'Incorrect size'
          assert hashlib.sha256(data).hexdigest() == spec['sha256'], 'Incorrect checksum'
          Path('index.html').write_bytes(data)
          print('Exact HTML reconstructed:', len(data), 'bytes')
          PY
      - name: Commit the verified publication file
        run: |
          if [ ! -f bootstrap/parts.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -r bootstrap
          git commit -m "Publish verified LECAA CAST 0.6.4 HTML"
          git push origin HEAD:main
